<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f1e5"/><stop offset="1" stop-color="#e6efe7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#173c2e" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/><circle cx="944" cy="122" r="188" fill="#d5e7db" opacity="0.78"/><circle cx="95" cy="1255" r="220" fill="#ead7c8" opacity="0.52"/>
  <g font-family="Apple SD Gothic Neo, Hiragino Sans, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#173c2e"/><text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff5df">旅</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#173c2e">서당 · 오늘의 한자</text><text x="165" y="119" font-size="22" fill="#627166">JLPT N4 · 10획</text>
    <rect x="70" y="170" width="940" height="420" rx="42" fill="#173c2e" filter="url(#shadow)"/><text x="540" y="418" text-anchor="middle" font-size="250" font-weight="700" fill="#fff7e7">旅</text><text x="540" y="500" text-anchor="middle" font-size="40" font-weight="700" fill="#efc7ac">여행</text><text x="540" y="548" text-anchor="middle" font-size="29" fill="#dfe8df">음독 リョ  ·  훈독 たび</text>
    <rect x="70" y="630" width="940" height="235" rx="34" fill="#fffaf0" filter="url(#shadow)"/><text x="110" y="692" font-size="25" font-weight="700" fill="#8d5f59">함께 외우는 두 글자 단어</text>
    <text x="110" y="772" font-size="37" font-weight="700" fill="#173c2e">旅行</text><text x="205" y="772" font-size="22" fill="#5f6d64">りょこう · 여행</text>
    <text x="110" y="825" font-size="37" font-weight="700" fill="#173c2e">旅館</text><text x="205" y="825" font-size="22" fill="#5f6d64">りょかん · 일본식 여관</text>
    <text x="570" y="772" font-size="37" font-weight="700" fill="#173c2e">旅客</text><text x="665" y="772" font-size="22" fill="#5f6d64">りょかく · 승객</text>
    <rect x="70" y="905" width="940" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/><text x="110" y="967" font-size="25" font-weight="700" fill="#8d5f59">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1037" font-size="31" font-weight="700" fill="#173c2e">旅行を計画する</text><text x="480" y="1037" font-size="23" fill="#5f6d64">여행을 계획하다</text>
    <text x="110" y="1098" font-size="31" font-weight="700" fill="#173c2e">旅館に泊まる</text><text x="415" y="1098" font-size="23" fill="#5f6d64">여관에 묵다</text>
    <text x="540" y="1262" text-anchor="middle" font-size="28" font-weight="700" fill="#173c2e">다음 여행에서 어디에 가보고 싶나요?</text>
  </g>
</svg>
