<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3df"/><stop offset="1" stop-color="#e7efe3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#173c2e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="950" cy="118" r="195" fill="#d79b5b" opacity="0.24"/>
  <circle cx="88" cy="1262" r="220" fill="#c8ddca" opacity="0.62"/>
  <g font-family="Apple SD Gothic Neo, Hiragino Sans, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#173c2e"/><text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff5df">書</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#173c2e">서당 · 오늘의 한자</text>
    <text x="165" y="119" font-size="22" fill="#627166">JLPT N4 · 9획</text>
    <rect x="70" y="170" width="940" height="420" rx="42" fill="#173c2e" filter="url(#shadow)"/>
    <text x="540" y="418" text-anchor="middle" font-size="250" font-weight="700" fill="#fff7e7">秋</text>
    <text x="540" y="500" text-anchor="middle" font-size="40" font-weight="700" fill="#efc7ac">가을</text>
    <text x="540" y="548" text-anchor="middle" font-size="27" fill="#dfe8df">음독 シュウ  ·  훈독 あき</text>
    <rect x="70" y="630" width="940" height="235" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="692" font-size="25" font-weight="700" fill="#9a5f38">함께 외우는 두 글자 단어</text>
    <text x="110" y="774" font-size="39" font-weight="700" fill="#173c2e">秋風</text><text x="215" y="774" font-size="23" fill="#5f6d64">あきかぜ · 가을바람</text>
    <text x="465" y="774" font-size="39" font-weight="700" fill="#173c2e">今秋</text><text x="570" y="774" font-size="23" fill="#5f6d64">こんしゅう · 올가을</text>
    <text x="815" y="774" font-size="39" font-weight="700" fill="#173c2e">昨秋</text><text x="920" y="774" font-size="20" fill="#5f6d64">さくしゅう</text>
    <rect x="70" y="905" width="940" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="967" font-size="25" font-weight="700" fill="#9a5f38">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1040" font-size="34" font-weight="700" fill="#173c2e">秋を感じる</text><text x="330" y="1040" font-size="24" fill="#5f6d64">가을을 느끼다</text>
    <text x="610" y="1040" font-size="34" font-weight="700" fill="#173c2e">秋を迎える</text><text x="830" y="1040" font-size="24" fill="#5f6d64">가을을 맞다</text>
    <text x="110" y="1112" font-size="25" fill="#5f6d64">秋に旅行します。</text><text x="110" y="1147" font-size="22" fill="#7b867f">가을에 여행합니다.</text>
    <text x="540" y="1262" text-anchor="middle" font-size="28" font-weight="700" fill="#173c2e">여러분은 무엇에서 가을을 느끼나요?</text>
  </g>
</svg>
