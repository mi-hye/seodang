<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/><stop offset="1" stop-color="#e6efe7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#173c2e" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="944" cy="122" r="188" fill="#d5e7db" opacity="0.78"/>
  <circle cx="95" cy="1255" r="220" fill="#ead7c8" opacity="0.52"/>
  <g font-family="Apple SD Gothic Neo, Hiragino Sans, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#173c2e"/><text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff5df">書</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#173c2e">서당 · 오늘의 한자</text>
    <text x="165" y="119" font-size="22" fill="#627166">JLPT N3 · 7획</text>
    <rect x="70" y="170" width="940" height="420" rx="42" fill="#173c2e" filter="url(#shadow)"/>
    <text x="540" y="418" text-anchor="middle" font-size="250" font-weight="700" fill="#fff7e7">決</text>
    <text x="540" y="500" text-anchor="middle" font-size="40" font-weight="700" fill="#efc7ac">정하다 · 결정하다</text>
    <text x="540" y="548" text-anchor="middle" font-size="27" fill="#dfe8df">음독 ケツ  ·  훈독 きめる・きまる</text>
    <rect x="70" y="630" width="940" height="235" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="692" font-size="25" font-weight="700" fill="#8d5f59">함께 외우는 두 글자 단어</text>
    <text x="110" y="774" font-size="39" font-weight="700" fill="#173c2e">決議</text><text x="215" y="774" font-size="23" fill="#5f6d64">けつぎ · 결의</text>
    <text x="420" y="774" font-size="39" font-weight="700" fill="#173c2e">決定</text><text x="525" y="774" font-size="23" fill="#5f6d64">けってい · 결정</text>
    <text x="765" y="774" font-size="39" font-weight="700" fill="#173c2e">決算</text><text x="870" y="774" font-size="21" fill="#5f6d64">けっさん · 결산</text>
    <rect x="70" y="905" width="940" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="967" font-size="25" font-weight="700" fill="#8d5f59">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1040" font-size="34" font-weight="700" fill="#173c2e">決定を下す</text><text x="340" y="1040" font-size="24" fill="#5f6d64">결정을 내리다</text>
    <text x="620" y="1040" font-size="30" font-weight="700" fill="#173c2e">決議を採択する</text>
    <text x="110" y="1112" font-size="25" fill="#5f6d64">予定を決めます。</text><text x="110" y="1147" font-size="22" fill="#7b867f">예정을 정합니다.</text>
    <text x="540" y="1262" text-anchor="middle" font-size="28" font-weight="700" fill="#173c2e">오늘 꼭 정하고 싶은 일은 무엇인가요?</text>
  </g>
</svg>
