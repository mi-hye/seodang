<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/>
      <stop offset="1" stop-color="#e6efe7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#173c2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="944" cy="122" r="188" fill="#d5e7db" opacity="0.78"/>
  <circle cx="95" cy="1255" r="220" fill="#ead7c8" opacity="0.52"/>

  <g font-family="Apple SD Gothic Neo, Hiragino Sans, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#173c2e"/>
    <text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff5df">書</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#173c2e">서당 · 오늘의 한자</text>
    <text x="165" y="119" font-size="22" fill="#627166">JLPT N4 · 8획</text>

    <rect x="70" y="170" width="940" height="420" rx="42" fill="#173c2e" filter="url(#shadow)"/>
    <text x="540" y="418" text-anchor="middle" font-size="250" font-weight="700" fill="#fff7e7">注</text>
    <text x="540" y="500" text-anchor="middle" font-size="40" font-weight="700" fill="#efc7ac">붓다 · 주의하다 · 주석</text>
    <text x="540" y="548" text-anchor="middle" font-size="27" fill="#dfe8df">음독 チュウ  ·  훈독 そそぐ</text>

    <rect x="70" y="630" width="940" height="235" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="692" font-size="25" font-weight="700" fill="#8d5f59">함께 외우는 단어</text>
    <text x="110" y="774" font-size="39" font-weight="700" fill="#173c2e">注意</text>
    <text x="215" y="774" font-size="24" fill="#5f6d64">ちゅうい · 주의</text>
    <text x="420" y="774" font-size="39" font-weight="700" fill="#173c2e">注目</text>
    <text x="525" y="774" font-size="24" fill="#5f6d64">ちゅうもく · 주목</text>
    <text x="765" y="774" font-size="39" font-weight="700" fill="#173c2e">注文</text>
    <text x="870" y="774" font-size="20" fill="#5f6d64">ちゅうもん · 주문</text>

    <rect x="70" y="905" width="940" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="967" font-size="25" font-weight="700" fill="#8d5f59">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1040" font-size="36" font-weight="700" fill="#173c2e">注意を払う</text>
    <text x="365" y="1040" font-size="25" fill="#5f6d64">주의를 기울이다</text>
    <text x="615" y="1040" font-size="36" font-weight="700" fill="#173c2e">注目を浴びる</text>
    <text x="890" y="1040" text-anchor="middle" font-size="25" fill="#5f6d64">주목받다</text>
    <text x="110" y="1112" font-size="25" fill="#5f6d64">大事な点に注意を払ってください。</text>
    <text x="110" y="1147" font-size="22" fill="#7b867f">중요한 점에 주의를 기울여 주세요.</text>

    <text x="540" y="1262" text-anchor="middle" font-size="29" font-weight="700" fill="#173c2e">‘주의를 기울이다’를 일본어로 바로 말할 수 있었나요?</text>
  </g>
</svg>
