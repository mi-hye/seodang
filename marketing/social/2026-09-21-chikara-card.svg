<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172d4c"/><stop offset="1" stop-color="#244f68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#172d4c" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="955" cy="118" r="195" fill="#ef9e4d" opacity="0.24"/>
  <circle cx="82" cy="1266" r="222" fill="#bed2e6" opacity="0.64"/>
  <g font-family="Apple SD Gothic Neo, Hiragino Sans, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#172d4c"/>
    <text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff7e7">書</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#172d4c">서당 · 오늘의 한자</text>
    <text x="165" y="119" font-size="22" fill="#607083">JLPT N4 · 2획</text>

    <rect x="70" y="170" width="940" height="420" rx="42" fill="url(#hero)" filter="url(#shadow)"/>
    <text x="540" y="421" text-anchor="middle" font-size="260" font-weight="700" fill="#fff8e9">力</text>
    <text x="540" y="500" text-anchor="middle" font-size="40" font-weight="700" fill="#ffc77f">힘</text>
    <text x="540" y="548" text-anchor="middle" font-size="27" fill="#e4edf5">음독 リョク・リキ  ·  훈독 ちから</text>

    <rect x="70" y="630" width="940" height="235" rx="34" fill="#fffaf1" filter="url(#shadow)"/>
    <text x="110" y="692" font-size="25" font-weight="700" fill="#c4682a">함께 외우는 두 글자 단어</text>
    <text x="110" y="774" font-size="39" font-weight="700" fill="#172d4c">努力</text>
    <text x="212" y="774" font-size="22" fill="#607083">どりょく · 노력</text>
    <text x="426" y="774" font-size="39" font-weight="700" fill="#172d4c">協力</text>
    <text x="528" y="774" font-size="22" fill="#607083">きょうりょく · 협력</text>
    <text x="782" y="774" font-size="39" font-weight="700" fill="#172d4c">実力</text>
    <text x="875" y="774" font-size="19" fill="#607083">じつりょく · 실력</text>

    <rect x="70" y="905" width="940" height="260" rx="34" fill="#fffaf1" filter="url(#shadow)"/>
    <text x="110" y="967" font-size="25" font-weight="700" fill="#c4682a">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1040" font-size="34" font-weight="700" fill="#172d4c">努力を重ねる</text>
    <text x="342" y="1040" font-size="23" fill="#607083">노력을 거듭하다</text>
    <text x="610" y="1040" font-size="34" font-weight="700" fill="#172d4c">協力を求める</text>
    <text x="842" y="1040" font-size="23" fill="#607083">협력을 구하다</text>
    <text x="110" y="1112" font-size="24" fill="#526274">日本語の勉強に力を入れています。</text>
    <text x="110" y="1147" font-size="22" fill="#778493">일본어 공부에 힘을 쏟고 있어요.</text>

    <text x="540" y="1262" text-anchor="middle" font-size="28" font-weight="700" fill="#172d4c">요즘 가장 힘을 쏟는 일본어 공부는 무엇인가요?</text>
  </g>
</svg>
