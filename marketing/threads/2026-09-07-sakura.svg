<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/>
      <stop offset="1" stop-color="#e7efe6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#173c2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="940" cy="135" r="185" fill="#dbe9df" opacity="0.7"/>
  <circle cx="105" cy="1235" r="210" fill="#edd9d4" opacity="0.55"/>

  <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
    <circle cx="96" cy="92" r="45" fill="#173c2e"/>
    <text x="96" y="111" text-anchor="middle" font-size="48" font-weight="700" fill="#fff5df">書</text>
    <text x="165" y="84" font-size="31" font-weight="700" fill="#173c2e">서당 · 오늘의 한자</text>
    <text x="165" y="119" font-size="22" fill="#627166">JLPT N1 · 10획</text>

    <rect x="70" y="170" width="940" height="440" rx="42" fill="#173c2e" filter="url(#shadow)"/>
    <text x="540" y="435" text-anchor="middle" font-size="270" font-weight="700" fill="#fff7e7">桜</text>
    <text x="540" y="520" text-anchor="middle" font-size="42" font-weight="700" fill="#f3c7bd">벚꽃</text>
    <text x="540" y="565" text-anchor="middle" font-size="26" fill="#dfe8df">음독 オウ  ·  훈독 さくら</text>

    <rect x="70" y="650" width="450" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="712" font-size="25" font-weight="700" fill="#8d5f59">구자체</text>
    <text x="295" y="835" text-anchor="middle" font-size="122" font-weight="700" fill="#173c2e">櫻</text>

    <rect x="560" y="650" width="450" height="260" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="600" y="712" font-size="25" font-weight="700" fill="#8d5f59">함께 외우는 단어</text>
    <text x="600" y="818" font-size="42" font-weight="700" fill="#173c2e">桜色</text>
    <text x="752" y="818" font-size="25" fill="#5f6d64">さくらいろ · 연분홍색</text>

    <rect x="70" y="950" width="940" height="230" rx="34" fill="#fffaf0" filter="url(#shadow)"/>
    <text x="110" y="1013" font-size="25" font-weight="700" fill="#8d5f59">자연스럽게 함께 쓰는 표현</text>
    <text x="110" y="1081" font-size="38" font-weight="700" fill="#173c2e">桜が咲く</text>
    <text x="350" y="1081" font-size="26" fill="#5f6d64">벚꽃이 피다</text>
    <text x="590" y="1081" font-size="38" font-weight="700" fill="#173c2e">桜が散る</text>
    <text x="830" y="1081" font-size="26" fill="#5f6d64">벚꽃이 지다</text>
    <text x="110" y="1135" font-size="25" fill="#5f6d64">公園の桜が満開だ。  공원의 벚꽃이 만개했다.</text>

    <text x="540" y="1267" text-anchor="middle" font-size="29" font-weight="700" fill="#173c2e">피는 벚꽃과 지는 벚꽃, 어느 쪽을 더 좋아하나요?</text>
  </g>
</svg>
