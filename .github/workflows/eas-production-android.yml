name: Deploy Android production

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-production-android
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing EXPO_TOKEN. Add an Expo access token in GitHub repository secrets."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local quality checks
        run: npm run quality:check:local

      # Google Play submission credentials are managed in EAS, not this repo.
      - name: Build and submit to Google Play
        run: >
          npm exec --yes eas-cli --
          build
          --platform android
          --profile production
          --non-interactive
          --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
