name: Deploy iOS production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-production-ios
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit iOS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Expo token
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing EXPO_TOKEN. Add an Expo access token in GitHub repository secrets."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local quality checks
        run: npm run quality:check:local

      - name: Build and submit to App Store Connect
        run: >
          npm exec --yes eas-cli --
          build
          --platform ios
          --profile production
          --non-interactive
          --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
