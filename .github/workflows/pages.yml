name: Deploy static docs

on:
  push:
    branches:
      - main
    paths:
      - docs/privacy-policy.html
      - docs/privacy-policy-legacy.html
      - docs/third-party-notices.html
      - prototype/quiz.html
      - prototype/src/share-quiz*
      - scripts/build-share-quiz.mjs
      - scripts/build-public-site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage public pages and expression quiz
        run: node scripts/build-public-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
