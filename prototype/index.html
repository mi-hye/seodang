<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efd8b6">
<title>서당</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #efd8b6; }
/* Background is full bleed; only the interaction layer consumes safe-area insets. */
main { position: relative; width: 100%; max-width: 480px; margin-inline: auto; height: 100svh; overflow: hidden; }
.scene { position: absolute; inset: 0; }
.scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 65% 50%; }
.safe-ui { position: absolute; inset: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); pointer-events: none; }
.safe-ui { display: flex; align-items: flex-end; }
@media (orientation: landscape) { .scene img { object-fit: contain; } }
/* The title remains part of the supplied artwork; loading controls are actual UI. */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
 .loading { width: 100%; padding: 18px 20px; border-radius: 18px; background: #faf3e8ed; color: #4c4535; pointer-events: auto; }
.loading-label { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 13px; font: 500 18px/1.5 -apple-system, sans-serif; }
.loading-track { height: 6px; border-radius: 999px; overflow: hidden; background: #dedbcd; }
.loading-fill { display: block; width: 0; height: 100%; background: #607450; transition: width .18s ease; }
.retry { margin-top: 16px; min-height: 48px; width: 100%; border: 0; border-radius: 10px; background: #586a4c; color: #fff; font-size: 18px; cursor: pointer; }
.retry:focus-visible { outline: 3px solid #33432a; outline-offset: 3px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .loading-fill { transition: none; } }
/* Small CSS petals: no additional image assets, hit targets stay unobstructed. */
.petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.petal-path { position: absolute; top: -24px; left: var(--x); animation: petal-fall var(--duration) var(--delay) linear infinite; }
.petal-sway { display: block; animation: petal-sway var(--sway) var(--delay) ease-in-out infinite alternate; }
.petal { display: block; width: var(--size); height: calc(var(--size) * .62); border-radius: 80% 15% 75% 25%; background: linear-gradient(135deg, #ffe4dd, #e9a9ac); opacity: var(--opacity); animation: petal-turn var(--turn) var(--delay) ease-in-out infinite; }
@keyframes petal-fall { from { transform: translate3d(-35px, -20px, 0); } to { transform: translate3d(65px, calc(100svh + 60px), 0); } }
@keyframes petal-sway { from { transform: translateX(-17px); } to { transform: translateX(20px); } }
@keyframes petal-turn { 0% { transform: rotate(0deg) scaleX(1); } 35% { transform: rotate(100deg) scaleX(.35); } 65% { transform: rotate(220deg) scaleX(.9); } 100% { transform: rotate(360deg) scaleX(1); } }
body.motion-paused .petals * { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .petals { display: none; } .petals * { animation: none; } }
</style>
</head>
<body>
<main aria-label="서당 시작 화면">
<div class="scene">
<img src="assets/start-loading.png" alt="" width="941" height="1672">
</div>
<div class="safe-ui">
<h1 class="sr-only">서당</h1>
<div class="loading" aria-busy="true">
<p class="loading-label"><span id="loading-label" role="status">불러오는 중</span><span id="loading-percent" aria-hidden="true">0%</span></p>
<div class="loading-track" role="progressbar" aria-label="화면 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loading-fill"></span></div>
<button class="retry" type="button" hidden>다시 시도</button>
</div>
</div>
<div class="petals" aria-hidden="true"></div>
</main>
<script>
// A bounded particle count keeps the mobile effect quiet and lightweight.
const layer = document.querySelector('.petals');
const petals = [
  [7, 19, -4, 8, .55], [23, 23, -16, 6, .45], [41, 21, -9, 9, .6],
  [61, 26, -20, 5, .4], [78, 24, -5, 7, .5], [12, 28, -23, 5, .4],
  [36, 25, -2, 6, .45], [66, 22, -12, 8, .5], [89, 29, -18, 5, .4],
];
for (const [i, [x, duration, delay, size, opacity]] of petals.entries()) {
  const path = document.createElement('span');
  path.className = 'petal-path';
  path.style.cssText = `--x:${x}%;--duration:${duration}s;--delay:${delay}s;--size:${size}px;--opacity:${opacity};--sway:${3 + i % 3}s;--turn:${5 + i % 4}s`;
  path.innerHTML = '<span class="petal-sway"><span class="petal"></span></span>';
  layer.append(path);
}
const pauseMotion = () => document.body.classList.toggle('motion-paused', document.hidden);
document.addEventListener('visibilitychange', pauseMotion);
pauseMotion();
</script>
<script type="module" src="src/loading.js"></script>
</body>
</html>
