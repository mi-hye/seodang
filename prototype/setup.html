<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<title>서당 · 시작 설정</title>
<link rel="stylesheet" href="src/setup.css">
<link rel="stylesheet" href="src/header.css">
</head>
<body>
<div class="setup-shell">
<div id="setup-header"></div>
<div class="progress" role="progressbar" aria-label="설정 진행" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1"><span></span></div>
<main><form>
<div class="step-content">
<section data-step="1">
<h1 tabindex="-1">배울 언어를 골라볼까요</h1>
<fieldset><legend class="sr-only">배울 언어</legend>
<label class="option"><input type="radio" name="language" value="ja" checked><span class="radio" aria-hidden="true"></span><span>일본어</span></label>
<label class="option unavailable"><input type="radio" name="language" value="ko" disabled><span class="radio" aria-hidden="true"></span><span>한국어</span><span class="availability">준비 중</span></label>
</fieldset>
</section>
<section data-step="2" hidden>
<h1 tabindex="-1">난이도를 선택해주세요</h1>
<fieldset><legend class="sr-only">난이도 1부터 7</legend>
<label class="option"><input type="radio" name="level" value="1" checked><span class="level-number">1</span><span>글씨를 읽을 줄 몰라요</span></label>
<label class="option"><input type="radio" name="level" value="2"><span class="level-number">2</span><span>글씨는 읽지만 단어가 낯설어요</span></label>
<label class="option"><input type="radio" name="level" value="3"><span class="level-number">3</span><span>짧은 문장을 이해할 수 있어요</span></label>
<label class="option"><input type="radio" name="level" value="4"><span class="level-number">4</span><span>일상 대화를 할 수 있어요</span></label>
<label class="option"><input type="radio" name="level" value="5"><span class="level-number">5</span><span>글의 핵심과 의견을 이해해요</span></label>
<label class="option"><input type="radio" name="level" value="6"><span class="level-number">6</span><span>일본어로 읽고 생각해요</span></label>
<label class="option"><input type="radio" name="level" value="7"><span class="level-number">7</span><span>일본어를 듣고 숨은 뜻까지 이해해요</span></label>
</fieldset>
</section>
<section data-step="3" hidden>
<h1 tabindex="-1">서당은 이렇게 배워요</h1>
<div id="onboarding-guide"></div>
</section>
</div>
<div class="actions"><p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p><button class="primary" type="submit">다음</button></div>
</form></main>
</div>
<dialog class="setup-settings" aria-labelledby="panel-title"></dialog>
<script type="module" src="src/setup.js"></script>
</body>
</html>
