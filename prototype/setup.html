<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/seodang-language-favicon-v1.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/seodang-language-touch-v1.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<title>서당 · 시작 설정</title>
<link rel="stylesheet" href="src/setup.css">
<link rel="stylesheet" href="src/header.css">
</head>
<body>
<div class="setup-shell">
<div id="setup-header"></div>
<div class="progress" role="progressbar" aria-label="설정 진행" data-i18n-label="설정 진행" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"><span></span></div>
<main><form>
<div class="step-content">
<section data-step="1">
<h1 tabindex="-1" class="language-question"><span lang="ko">배울 언어를 선택해 주세요</span><span lang="ja">学ぶ言語を選んでください</span></h1>
<fieldset><legend class="sr-only"><span lang="ko">배울 언어</span> / <span lang="ja">学ぶ言語</span></legend>
<label class="option"><input type="radio" name="language" value="ja" checked><span class="radio" aria-hidden="true"></span><span class="language-option"><span lang="ko">일본어</span><span lang="ja">日本語</span></span></label>
<label class="option"><input type="radio" name="language" value="ko"><span class="radio" aria-hidden="true"></span><span class="language-option"><span lang="ko">한국어</span><span lang="ja">韓国語</span></span></label>
</fieldset>
</section>
<section data-step="2" hidden>
<h1 tabindex="-1" data-i18n="난이도를 선택해 주세요">난이도를 선택해 주세요</h1>
<fieldset><legend class="sr-only" data-i18n="난이도 1부터 5">난이도 1부터 5</legend>
<label class="option"><input type="radio" name="level" value="0" checked><span class="level-number">1</span><span data-i18n="글자를 읽고 발음을 익혀요">글자를 읽고 발음을 익혀요</span></label>
<label class="option"><input type="radio" name="level" value="2"><span class="level-number">2</span><span data-i18n="짧은 문장으로 뜻을 전해요">짧은 문장으로 뜻을 전해요</span></label>
<label class="option"><input type="radio" name="level" value="4"><span class="level-number">3</span><span data-i18n="일상에서 질문과 답을 주고받아요">일상에서 질문과 답을 주고받아요</span></label>
<label class="option"><input type="radio" name="level" value="5"><span class="level-number">4</span><span data-i18n="글에서 정보와 근거를 찾아 판단해요">글에서 정보와 근거를 찾아 판단해요</span></label>
<label class="option"><input type="radio" name="level" value="7"><span class="level-number">5</span><span data-i18n="전문 기사와 논설의 논리를 분석해요">전문 기사와 논설의 논리를 분석해요</span></label>
</fieldset>
<input type="radio" name="level" value="8" hidden aria-hidden="true" tabindex="-1">
<div id="setup-analytics"></div>
</section>
<section data-step="3" hidden>
<h1 tabindex="-1" data-i18n="서당은 이렇게 배워요">서당은 이렇게 배워요</h1>
<div id="onboarding-guide"></div>
</section>
</div>
<div class="actions"><p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p><button class="primary" type="submit"><span lang="ko">다음</span> / <span lang="ja">次へ</span></button></div>
</form></main>
</div>
<dialog class="setup-settings" aria-labelledby="panel-title"></dialog>
<script type="module" src="src/setup.js"></script>
</body>
</html>
